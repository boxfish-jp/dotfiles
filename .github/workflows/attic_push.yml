name: attic-push

# 全ブランチへの push で server のシステム closure をビルドし自前 attic へ push する。
# 秘密は Secrets/Variables 参照のみ。ファイルへの直書きは禁止(public リポジトリのため)。
# 必要な設定:
#   Variables: ATTIC_HOST (例: monitor-server.taildb6ca.ts.net /疎通確認用),
#              ATTIC_ENDPOINT (例: http://monitor-server.taildb6ca.ts.net:8080 /cache 名なし)
#   Secrets:   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET (tag:ci 付き OAuth client),
#              ATTIC_TOKEN (`atticadm make-token --pull shared --push shared` で発行。root 不可)
on:
  push:
    branches:
      - "**"

concurrency:
  group: attic-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Tailscale
        if: ${{ secrets.TS_OAUTH_SECRET != '' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.ATTIC_HOST }}

      - name: Setup Attic cache
        if: ${{ secrets.ATTIC_TOKEN != '' && vars.ATTIC_ENDPOINT != '' }}
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ vars.ATTIC_ENDPOINT }}
          cache: shared
          token: ${{ secrets.ATTIC_TOKEN }}
          # 自動 push は切って server closure のみ明示 push する
          skip-push: "true"

      - name: Build server system closure
        run: nix build .#nixosConfigurations.server.config.system.build.toplevel --print-out-paths

      - name: Push server closure to attic
        if: ${{ secrets.ATTIC_TOKEN != '' }}
        run: attic push shared ./result
